<article class="post-card">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.5rem;">
    <a class="post-author" href="{% url 'posts:for_user' username=post.user.username %}">
      @{{ post.user.username }}
    </a>
    {% if post.group %}
      <a class="post-group-badge" href="{% url 'groups:single' slug=post.group.slug %}">
        <i class="bi bi-people-fill"></i> {{ post.group.name }}
      </a>
    {% endif %}
  </div>

  <div class="post-body">{{ post.message_html|safe }}</div>

  <div class="post-meta">
    <a href="{% url 'posts:single' username=post.user.username pk=post.pk %}">
      <i class="bi bi-clock"></i> {{ post.created_at|date:"M j, Y" }}
    </a>
    {% if user.is_authenticated and post.user == user and not hide_delete %}
      <span class="dot">&bull;</span>
      <a href="{% url 'posts:delete' pk=post.pk %}" style="color:var(--danger);">
        <i class="bi bi-trash"></i> Delete
      </a>
    {% endif %}
  </div>
</article>
