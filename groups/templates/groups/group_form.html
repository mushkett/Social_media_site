{% extends 'groups/group_base.html' %}
{% load crispy_forms_tags %}

{% block group_content %}
<div class="page-wrap" style="max-width:600px;">
  <p class="section-label">Community</p>
  <h1 class="page-title">Create a <span>Group</span></h1>
  <p style="color:var(--text-2);font-size:.95rem;margin-bottom:2rem;">
    Build a space for like-minded people to gather, share posts, and connect.
  </p>

  <div class="card">
    <div class="card-body">
      <form action="{% url 'groups:create' %}" method="post" id="groupForm">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Create Group
          </button>
          <a href="{% url 'groups:all' %}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
