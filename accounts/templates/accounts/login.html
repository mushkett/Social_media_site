{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Log In — Star Social{% endblock %}

{% block content %}
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-title">Welcome<br>back.</div>
      <p class="auth-subtitle">Sign in to continue to Star Social.</p>

      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100 mt-2">
          Log In <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </form>

      <div class="auth-divider">or</div>

      <p style="text-align:center;font-size:.85rem;color:var(--text-3);">
        Don't have an account?
        <a href="{% url 'accounts:signup' %}" style="color:var(--accent);">Sign up free</a>
      </p>
    </div>
  </div>
{% endblock %}
