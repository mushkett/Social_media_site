{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Sign Up — Star Social{% endblock %}

{% block content %}
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-title">Join <em style="font-style:italic;color:var(--accent);">Star</em><br>Social.</div>
      <p class="auth-subtitle">Create your free account and find your community.</p>

      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100 mt-2">
          Create Account <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </form>

      <div class="auth-divider">or</div>

      <p style="text-align:center;font-size:.85rem;color:var(--text-3);">
        Already have an account?
        <a href="{% url 'accounts:login' %}" style="color:var(--accent);">Log in</a>
      </p>
    </div>
  </div>
{% endblock %}
