[project]
name = "social-media-site"
version = "1.0.0"
description = "A Django social media application with best practices 2026"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Developer", email = "dev@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # Core Django
    "Django>=5.2,<6.0",
    "asgiref>=3.8.0",

    # ASGI Server
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",

    # Database
    "psycopg[binary]>=3.2.0",
    "dj-database-url>=2.2.0",

    # Cache
    "django-redis>=5.4.0",
    "redis>=5.0.0",

    # Security & Utils
    "python-decouple>=3.8",
    "nh3>=0.2.14",
    "django-csp>=4.0",
    "django-ratelimit>=4.1.0",

    # Static files
    "whitenoise>=6.7.0",

    # Forms & Frontend
    "django-bootstrap5>=24.2",
    "django-crispy-forms>=2.3",
    "crispy-bootstrap5>=2024.2",

    # Markdown
    "markdown-it-py>=3.0.0",

    # Logging
    "structlog>=24.0.0",

    # Health checks
    "django-health-check>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "django-extensions>=3.2.0",
    "ruff>=0.8.0",
    "bandit[toml]>=1.8.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "django-stubs>=5.0.0",
    "pre-commit>=3.7.0",
    "ipython>=8.20.0",
]

[project.urls]
Homepage = "https://github.com/mushkett/Social_media_site"
Repository = "https://github.com/mushkett/Social_media_site"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["social_media", "accounts", "groups", "posts", "core"]

# ============== Tool Configurations ==============

[tool.ruff]
target-version = "py312"
line-length = 119
exclude = [
    ".venv",
    "migrations",
    "__pycache__",
    ".git",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert used (OK in tests)
    "S105",   # hardcoded password (false positives)
    "DJ001",  # null=True on CharField (sometimes needed)
    "DJ012",  # Meta class ordering - Django models have specific patterns
    "RUF012", # Mutable class attrs - Django Meta classes use lists intentionally
    "RUF005", # Collection concatenation - OK for readability in some cases
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"conftest.py" = ["S101", "S106"]
"*/migrations/*.py" = ["E501"]
"social_media/settings/*.py" = ["F401", "F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "groups", "posts", "core", "social_media"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
skips = ["B101"]  # assert_used

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "social_media.settings.dev"
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = "-v --tb=short"
testpaths = ["tests", "accounts", "groups", "posts"]

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "social_media/settings/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
# Gradual typing - start permissive, tighten over time
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["migrations", ".venv"]

[tool.django-stubs]
django_settings_module = "social_media.settings.dev"
